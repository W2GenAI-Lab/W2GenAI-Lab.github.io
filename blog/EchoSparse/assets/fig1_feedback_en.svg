<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Inter, 'Helvetica Neue', Arial, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="520" fill="#000000"/>
<text x="30" y="40.0" font-size="22" fill="#f4f4f1" text-anchor="start" font-weight="700">One set of statistics, used in three places</text>
<rect x="30" y="80" width="270" height="70" rx="8" fill="#141518" stroke="#b9a3ff" stroke-width="1.5"/>
<text x="165.0" y="111.5" font-size="14" fill="#f4f4f1" text-anchor="middle">LSE  a_i</text>
<text x="165.0" y="128.3" font-size="14" fill="#f4f4f1" text-anchor="middle">(softmax scaling)</text>
<rect x="30" y="170" width="270" height="70" rx="8" fill="#141518" stroke="#b9a3ff" stroke-width="1.5"/>
<text x="165.0" y="201.5" font-size="14" fill="#f4f4f1" text-anchor="middle">block-mass map  M_ab</text>
<text x="165.0" y="218.3" font-size="14" fill="#f4f4f1" text-anchor="middle">(relative importance of blocks)</text>
<text x="30" y="72.0" font-size="13" fill="#9a9ea6" text-anchor="start" font-style="italic">step t−1</text>
<text x="360" y="72.0" font-size="13" fill="#9a9ea6" text-anchor="start" font-style="italic">step t</text>
<rect x="360" y="80" width="290" height="70" rx="8" fill="#141518" stroke="#45d0c1" stroke-width="1.5"/>
<text x="505.0" y="111.5" font-size="14" fill="#f4f4f1" text-anchor="middle">① fixed offset</text>
<text x="505.0" y="128.3" font-size="14" fill="#f4f4f1" text-anchor="middle">a_i replaces the row max</text>
<rect x="360" y="170" width="290" height="70" rx="8" fill="#141518" stroke="#45d0c1" stroke-width="1.5"/>
<text x="505.0" y="201.5" font-size="14" fill="#f4f4f1" text-anchor="middle">② choose resolution</text>
<text x="505.0" y="218.3" font-size="14" fill="#f4f4f1" text-anchor="middle">rank by M: exact / refined / mean</text>
<rect x="360" y="260" width="290" height="70" rx="8" fill="#141518" stroke="#45d0c1" stroke-width="1.5"/>
<text x="505.0" y="283.09999999999997" font-size="14" fill="#f4f4f1" text-anchor="middle">③ compensate</text>
<text x="505.0" y="299.9" font-size="14" fill="#f4f4f1" text-anchor="middle">skipped blocks join the same</text>
<text x="505.0" y="316.7" font-size="14" fill="#f4f4f1" text-anchor="middle">softmax as (k̃, ṽ, n)</text>
<line x1="300" y1="115" x2="360" y2="115" stroke="#b9a3ff" stroke-width="2" marker-end="url(#ah)"/>
<line x1="300" y1="205" x2="360" y2="205" stroke="#b9a3ff" stroke-width="2" marker-end="url(#ah)"/>
<line x1="300" y1="205" x2="360" y2="290" stroke="#b9a3ff" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="6 4"/>
<rect x="700" y="80" width="270" height="250" rx="8" fill="#0b0c0e" stroke="#202226" stroke-width="1.5"/>
<text x="835" y="108.0" font-size="14" fill="#f4f4f1" text-anchor="middle" font-weight="700">fused attention kernel</text>
<rect x="725" y="125" width="220" height="38" rx="6" fill="#7ea9ff" stroke="#7ea9ff" stroke-width="1.5"/>
<text x="835.0" y="148.9" font-size="14" fill="#000" text-anchor="middle" font-weight="700">exact  m=64</text>
<rect x="725" y="175" width="220" height="38" rx="6" fill="#f2b544" stroke="#f2b544" stroke-width="1.5"/>
<text x="835.0" y="198.9" font-size="14" fill="#000" text-anchor="middle" font-weight="700">refined  m=4</text>
<rect x="725" y="225" width="220" height="38" rx="6" fill="#a88230" stroke="#a88230" stroke-width="1.5"/>
<text x="835.0" y="248.9" font-size="14" fill="#000" text-anchor="middle" font-weight="700">mean  m=1</text>
<rect x="725" y="275" width="220" height="40" rx="6" fill="none" stroke="#f4f4f1" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="835.0" y="299.55" font-size="13" fill="#f4f4f1" text-anchor="middle">one numerator, one denominator</text>
<line x1="650" y1="115" x2="700" y2="150" stroke="#45d0c1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="650" y1="205" x2="700" y2="205" stroke="#45d0c1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="650" y1="295" x2="700" y2="265" stroke="#45d0c1" stroke-width="2" marker-end="url(#ah)"/>
<rect x="360" y="390" width="610" height="56" rx="8" fill="#141518" stroke="#45d0c1" stroke-width="1.5"/>
<text x="665.0" y="423.25" font-size="15" fill="#f4f4f1" text-anchor="middle" font-weight="700">output õ  +  new LSE, new block masses</text>
<line x1="835" y1="330" x2="835" y2="390" stroke="#f4f4f1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="360" y1="418" x2="165" y2="418" stroke="#b9a3ff" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="6 4"/>
<line x1="165" y1="418" x2="165" y2="245" stroke="#b9a3ff" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="6 4"/>
<text x="165" y="440.0" font-size="13" fill="#b9a3ff" text-anchor="middle">becomes the LSE and block masses of step t+1</text>
<text x="30" y="495.0" font-size="13" fill="#9a9ea6" text-anchor="start" font-style="italic">LSE supplies the scaling, block mass supplies relative importance; both fall out of the same pass.</text>
</svg>