<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Inter, 'Helvetica Neue', Arial, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="470" fill="#000000"/>
<text x="30" y="40.0" font-size="20" fill="#f4f4f1" text-anchor="start" font-weight="700">三级软件流水的装载 / 计算时间线（示意，非实测）</text>
<text x="30" y="135.0" font-size="15" fill="#f4f4f1" text-anchor="start" font-weight="700">搬运 (TMA)</text>
<text x="30" y="245.0" font-size="15" fill="#f4f4f1" text-anchor="start" font-weight="700">计算 (MMA)</text>
<rect x="150.0" y="85" width="150.0" height="24" rx="5" fill="#7ea9ff" stroke="#7ea9ff" stroke-width="1"/>
<text x="225.0" y="101.2" font-size="12" fill="#000" text-anchor="middle">T0 → 槽位 0</text>
<rect x="190.0" y="113" width="150.0" height="24" rx="5" fill="#45d0c1" stroke="#45d0c1" stroke-width="1"/>
<text x="265.0" y="129.2" font-size="12" fill="#000" text-anchor="middle">T1 → 槽位 1</text>
<rect x="230.0" y="141" width="150.0" height="24" rx="5" fill="#f2b544" stroke="#f2b544" stroke-width="1"/>
<text x="305.0" y="157.2" font-size="12" fill="#000" text-anchor="middle">T2 → 槽位 2</text>
<rect x="400.0" y="85" width="150.0" height="24" rx="5" fill="#7ea9ff" stroke="#7ea9ff" stroke-width="1"/>
<text x="475.0" y="101.2" font-size="12" fill="#000" text-anchor="middle">T3 → 槽位 0</text>
<rect x="500.0" y="113" width="150.0" height="24" rx="5" fill="#45d0c1" stroke="#45d0c1" stroke-width="1"/>
<text x="575.0" y="129.2" font-size="12" fill="#000" text-anchor="middle">T4 → 槽位 1</text>
<rect x="300.0" y="215" width="100.0" height="40" rx="5" fill="#7ea9ff" stroke="#7ea9ff" stroke-width="1"/>
<text x="350.0" y="239.9" font-size="14" fill="#000" text-anchor="middle" font-weight="700">T0</text>
<rect x="400.0" y="215" width="100.0" height="40" rx="5" fill="#45d0c1" stroke="#45d0c1" stroke-width="1"/>
<text x="450.0" y="239.9" font-size="14" fill="#000" text-anchor="middle" font-weight="700">T1</text>
<rect x="500.0" y="215" width="100.0" height="40" rx="5" fill="#f2b544" stroke="#f2b544" stroke-width="1"/>
<text x="550.0" y="239.9" font-size="14" fill="#000" text-anchor="middle" font-weight="700">T2</text>
<rect x="600.0" y="215" width="100.0" height="40" rx="5" fill="#7ea9ff" stroke="#7ea9ff" stroke-width="1"/>
<text x="650.0" y="239.9" font-size="14" fill="#000" text-anchor="middle" font-weight="700">T3</text>
<rect x="700.0" y="215" width="100.0" height="40" rx="5" fill="#45d0c1" stroke="#45d0c1" stroke-width="1"/>
<text x="750.0" y="239.9" font-size="14" fill="#000" text-anchor="middle" font-weight="700">T4</text>
<line x1="150" y1="300" x2="780.0" y2="300" stroke="#9a9ea6" stroke-width="2" marker-end="url(#ah)"/>
<text x="780.0" y="322.0" font-size="12" fill="#9a9ea6" text-anchor="end">时间 →</text>
<rect x="400.0" y="150" width="380" height="32" rx="6" fill="#141518" stroke="#b9a3ff" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="590.0" y="170.2" font-size="12" fill="#f4f4f1" text-anchor="middle">槽位 0 被第 0 块用完后才能装入第 3 块</text>
<line x1="410.0" y1="150" x2="410.0" y2="111" stroke="#b9a3ff" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="6 4"/>
<rect x="150" y="395" width="600" height="36" rx="6" fill="#141518" stroke="#45d0c1" stroke-width="1.5"/>
<text x="450.0" y="417.55" font-size="13" fill="#f4f4f1" text-anchor="middle" font-weight="700">三个槽位 ≠ 三组 warp，也不是三个 kernel</text>
</svg>